<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Blossom Access · Blossom ImgBed</title>
  <link rel="icon" href="/static/media/logo.png">
  <link rel="stylesheet" href="/css/blossom-access.css">
</head>
<body>
  <main class="page">
    <header>
      <div>
        <p class="eyebrow">Blossom ImgBed</p>
        <h1>Blossom Access</h1>
        <p>Only listed Nostr public keys can upload or delete through Blossom. Public GET and HEAD access is unchanged.</p>
      </div>
      <a class="secondary" href="/dashboard">Back to admin</a>
    </header>

    <section class="card" aria-labelledby="add-title">
      <h2 id="add-title">Add allowed pubkey</h2>
      <form id="add-form">
        <label for="pubkey">Nostr pubkey</label>
        <input id="pubkey" name="pubkey" required autocomplete="off" spellcheck="false"
               placeholder="npub1… or 64-character hex">
        <label for="note">Note <span>(optional)</span></label>
        <input id="note" name="note" maxlength="200" autocomplete="off" placeholder="HaiNei test account">
        <button type="submit">Add pubkey</button>
      </form>
      <p id="message" class="message" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">Allowed Nostr Pubkeys</h2>
        <button id="refresh" class="secondary" type="button">Refresh</button>
      </div>
      <div id="loading">Loading…</div>
      <div id="empty" hidden>No pubkeys have been allowed yet.</div>
      <div class="table-wrap">
        <table id="pubkeys" hidden>
          <thead><tr><th>Public key</th><th>Note</th><th>Added</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <script type="module" src="/js/blossom-access.js"></script>
</body>
</html>
